version: '3.8'

services:
  sentinel-fraud-detection:
    build: .
    container_name: sentinel_banking_fraud_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=banking-sentinel-production-secure-key-2026
      - DATABASE_URL=sqlite:///database/banking_fraud.db
    volumes:
      - ./database:/app/database
      - ./dataset/uploads:/app/dataset/uploads
      - ./reports_export:/app/reports_export
